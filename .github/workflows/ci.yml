name: CI

on:
  push:
    branches: [main, 'chatgpt/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/accounting_system_test
      SESSION_SECRET: ci-test-secret
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install
      - name: Build React salary module
        run: |
          cd REACT
          npm install
          npm run build
      - run: npm test
      - run: npm run lint
      - name: Smoke-test real application startup
        shell: bash
        run: |
          NODE_ENV=development COOKIE_SECURE=false npm start > /tmp/accounting-app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/accounting-app.log
          exit 1
