services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/accounting_system
      SESSION_SECRET: local-docker-change-this-before-real-deployment
    ports:
      - '3000:3000'

volumes:
  mongo_data:
